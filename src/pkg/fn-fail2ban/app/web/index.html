<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Fail2ban</title>
<!-- 在样式之前定好主题，避免浅色用户先闪一下深色界面 -->
<script>
(function () {
  try {
    var saved = localStorage.getItem('f2b-theme') || 'auto';
    var light = saved === 'light' || (saved === 'auto' && window.matchMedia &&
      window.matchMedia('(prefers-color-scheme: light)').matches);
    document.documentElement.dataset.theme = light ? 'light' : 'dark';
  } catch (e) { /* 隐私模式下 localStorage 可能不可用，退回默认深色 */ }
})();
</script>
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 首屏占位：等 /api/session 与 /api/meta 返回期间避免整屏空白 -->
<div class="boot" id="bootSplash">
  <div class="boot-card"><span class="spinner"></span><span data-i18n="common.booting">正在连接面板…</span></div>
</div>

<!-- 主界面（面板不再有登录页，打开即进入管理界面） -->
<div class="app" id="app">
  <div class="scrim" id="scrim"></div>

  <aside class="sidebar" id="sidebar">
    <nav class="nav" id="tabs">
      <button data-view="dashboard" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span data-i18n="nav.dashboard">概览</span>
      </button>
      <button data-view="jails">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7.5 3v5.5c0 4.3-3.1 7.6-7.5 9.2-4.4-1.6-7.5-4.9-7.5-9.2V6z"/></svg>
        <span data-i18n="nav.jails">Jail 管理</span>
      </button>
      <button data-view="bans">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M6.2 6.2l11.6 11.6"/></svg>
        <span data-i18n="nav.bans">封禁管理</span>
        <span class="nav-badge" id="navBanCount"></span>
      </button>
      <button data-view="filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 5h17l-6.6 7.6V19l-3.8-2.2v-4.2z"/></svg>
        <span data-i18n="nav.filters">过滤器</span>
      </button>
      <button data-view="fnknock">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 10.5V7.8a4.5 4.5 0 0 1 9 0v2.7"/><rect x="4.5" y="10.5" width="15" height="9.5" rx="2.2"/><path d="M12 13.8v2.6"/></svg>
        <span data-i18n="nav.fnknock">fn-knock 联动</span>
      </button>
      <button data-view="logs">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/><path d="M9 12.5h6M9 16h6"/></svg>
        <span data-i18n="nav.logs">日志</span>
      </button>
      <button data-view="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span data-i18n="nav.settings">设置</span>
        <span class="nav-badge nav-alert" id="navUpdateDot" hidden></span>
      </button>
    </nav>

    <div class="sidebar-foot">
      <!-- 主题 / 语言并排图标按钮，收起时侧栏只剩图标 -->
      <div class="foot-row">
        <button class="icon-btn" id="btnTheme" title="切换主题" aria-label="切换主题">
          <span id="themeIcon"></span>
        </button>
        <button class="icon-btn" id="btnLang" title="切换语言" aria-label="切换语言">
          <span id="langIcon"></span>
        </button>
      </div>
      <div class="ver-line" id="verLine" title="面板版本">
        <span class="ver-ic" id="verIcon" aria-hidden="true"></span>
        <span class="mono" id="verText">v—</span>
      </div>
      <!-- 桌面才显示（窄屏由样式隐藏），收起后侧栏变 62px 图标轨道 -->
      <button type="button" class="icon-btn wide ghost collapse-btn" id="btnCollapse"
              title="收起侧栏" aria-label="收起侧栏" aria-expanded="true" aria-controls="sidebar">
        <span id="collapseIcon"></span>
      </button>
    </div>
  </aside>

  <div class="content">
    <header class="topbar">
      <button class="icon-btn" id="menuToggle" aria-label="打开菜单">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <div class="page-head">
        <h1 id="pageTitle" data-i18n="nav.dashboard">概览</h1>
      </div>
      <div class="spacer" style="flex:1"></div>
      <!-- 服务状态徽章靠右，与「重载配置 / 刷新」排在一起：'
           它描述的是整个面板的状态，不是当前页面的标题修饰。 -->
      <span class="badge muted" id="svcBadge" role="status" aria-live="polite" data-i18n="dash.checking">检测中…</span>
      <div class="tools">
        <button class="btn sm" id="btnReload" title="重新读取配置并生效" data-i18n="common.reload">重载配置</button>
        <button class="btn sm" id="btnRefresh" data-i18n="common.refresh">刷新</button>
      </div>
    </header>

    <main id="view"></main>
  </div>
</div>

<!-- 编辑抽屉 -->
<div class="drawer-mask" id="drawerMask"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
  <div class="drawer-head">
    <h3 id="drawerTitle" data-i18n="common.edit">编辑</h3>
    <div class="spacer" style="flex:1"></div>
    <button class="btn sm ghost" id="drawerClose" aria-label="关闭">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
  <div class="drawer-foot" id="drawerFoot"></div>
</aside>

<!-- 一键升级遮罩：服务会在升级过程中停止，期间接口全部失败属正常 -->
<div class="upoverlay" id="upOverlay" hidden>
  <div class="upoverlay-box" role="dialog" aria-modal="true" aria-labelledby="upTitle">
    <!-- 旋转图标由 app.js 注入（样式按 .upspin svg 定尺寸与动画） -->
    <span class="upspin" id="upSpin" aria-hidden="true"></span>
    <div class="uptitle" id="upTitle" data-i18n="update.upgrading">正在升级</div>
    <div class="upstage" id="upStage"></div>
    <!-- 进度区两种形态共用同一块固定高度：下载阶段有真实字节数 → 进度条 + 大小 + 百分比；
         其余阶段没有可测总量 → 不画进度条，只在同一块空间里显示「准备中…」，不假装有百分比。 -->
    <div class="upprog-block" id="upProgBlock">
      <div class="upprog-track" id="upProgTrack" hidden>
        <div class="upprog"><span class="upprog-fill" id="upProgFill" style="width:0%"></span></div>
        <div class="upprog-meta">
          <span class="upmeta-size" id="upProgBytes"></span>
          <span class="upmeta-pct" id="upProgPct"></span>
        </div>
      </div>
      <div class="upprog-ready" id="upProgReady" data-i18n="update.stagePreparing">准备中…</div>
    </div>
    <div class="upkeep" id="upKeep" data-i18n="update.keepOpen">升级期间请勿关闭页面。</div>
    <button type="button" class="btn sm" id="upReload" hidden data-i18n="update.reload">立即重新加载</button>
  </div>
</div>

<!-- 手机端选择器：原生 <select> 在手机上弹出的是系统自带列表，主题、触控尺寸与
     桌面端完全是两套东西。手机上改用它下面的底部选择条，与面板其它部分同一套样式。 -->
<div class="picker-mask" id="pickerMask" hidden>
  <div class="picker-sheet" role="dialog" aria-modal="true" aria-labelledby="pickerTitle">
    <div class="picker-title" id="pickerTitle"></div>
    <div class="picker-list" id="pickerList"></div>
    <button type="button" class="btn picker-cancel" id="pickerCancel" data-i18n="common.cancel">取消</button>
  </div>
</div>

<div class="toast-host" id="toastHost" role="status" aria-live="polite"></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
